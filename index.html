<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- ===== SEO ===== -->
  <title>Han's Portfolio</title>
  <link rel="icon" type="image/png" href="/assets/images/favicon.png?v=3">
  <link rel="apple-touch-icon" href="/assets/images/me.png?v=3">
  <meta name="description" content="Han Lwin Htoo, Computer Engineering (Cloud Systems) student at Singapore Polytechnic. Seeking an internship in cloud, infrastructure or cybersecurity from 15 March to 13 August 2027.">
  <meta name="author" content="Han Lwin Htoo">
  <meta name="keywords" content="Han Lwin Htoo, cloud, AWS, infrastructure, cybersecurity, Proxmox, homelab, Linux, RHEL, Windows Server, Active Directory, Cisco, OSPF, networking, internship, Singapore Polytechnic">
  <meta name="theme-color" content="#141412">
  <link rel="canonical" href="https://www.hanlwinhtoo.dev/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Han Lwin Htoo">
  <meta property="og:title" content="Han Lwin Htoo — Cloud, Infrastructure & Security">
  <meta property="og:description" content="I run a Proxmox homelab to learn infrastructure hands-on.">
  <meta property="og:url" content="https://www.hanlwinhtoo.dev/">
  <meta property="og:image" content="https://www.hanlwinhtoo.dev/assets/images/me.png?v=3">
  <meta name="twitter:card" content="summary">
  <!-- Site name shown in Google results, above the title link (instead of the domain).
       Keep "name" the same as og:site_name and the top-bar brand. -->
  <script type="application/ld+json">
  {"@context": "https://schema.org", "@type": "WebSite", "name": "Han Lwin Htoo", "alternateName": "Han Lwin Htoo Portfolio", "url": "https://www.hanlwinhtoo.dev/",
   "author": {"@type": "Person", "name": "Han Lwin Htoo", "url": "https://www.hanlwinhtoo.dev/", "image": "https://www.hanlwinhtoo.dev/assets/images/me.png"}}
  </script>
  <!-- Sodium's dark theme is data-theme="dark" on <html>. Dark is the default; light only when the visitor chose it.
       Applied before paint, so the page never flashes the other theme. -->
  <script>
    var light = false; try { light = localStorage.getItem('theme-choice') === 'light'; } catch (e) {}
    if (!light) document.documentElement.setAttribute('data-theme', 'dark');
  </script>
  <!-- The page is drawn by this script; blocking="render" holds the first paint until it has run, so the page never
       shows blank and the page-change fade lands on the finished page. -->
  <script type="module" blocking="render" src="/src/main.tsx"></script>
</head>
<body class="sodium">
  <div id="root"></div>
</body>
</html>
